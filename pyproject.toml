[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geovision-bench"
version = "0.1.0"
description = "Reproducible satellite RGB classification with split audits and calibration"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{name = "Sanusi Abdulfatai Oyewunmi"}]
requires-python = ">=3.12"
dependencies = ["torch>=2.5,<3", "numpy>=2,<3", "Pillow>=11,<14", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
geovision = "geovision.cli:main"

[project.urls]
Repository = "https://github.com/dimxxkun/geovision-bench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
